name: Test & Build
on:
  push:
    branches:
      - master
      - dev
      - v*
      - beta-v*
      - release/*
    tags:
      - v*
  pull_request:

#env:
#  DOCKER_HUB_REPO: pihole

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      ARCH: "amd64 arm64"
      DEBIAN_VERSION: "buster"
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v1
      - name: Build images
        run: |
            docker --version
